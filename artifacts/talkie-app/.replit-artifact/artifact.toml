kind = "web"
previewPath = "/"
title = "Talkie"
description = "Application de messagerie Talkie avec comptes utilisateurs, contacts, messages texte et médias, notifications et temps réel."
version = "1.0.0"
id = "artifacts/talkie-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20801

[services.development]
run = "pnpm --filter @workspace/talkie-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/talkie-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/talkie-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20801"
BASE_PATH = "/"
